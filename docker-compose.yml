version: '3.8'

services:
  # Database Service (UNCHANGED - holds all live data, never recreated)
  db:
    image: postgres:15-alpine
    container_name: stream-prompts-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: stream_prompts
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Studio (Next.js UI + API, replaces legacy frontend + backend)
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-prompts-studio
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/stream_prompts
    ports:
      - '3004:3000'
